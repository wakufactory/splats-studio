<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaussian Splat Viewer</title>
  <link rel="stylesheet" href="./viewer.css">
  <link rel="stylesheet" href="./header.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body class="file-viewer">
  <main id="file-viewer" aria-label="Gaussian Splat Viewer">
    <div id="viewport"></div>
    <header class="toolbar app-header">
      <div class="file-tools">
        <div class="header-title">
          <p class="eyebrow">SPARK.JS / FILE VIEWER</p>
          <h1>Gaussian Splat Viewer</h1>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <button id="open" class="primary" type="button">開く</button>
        <!-- Leave accept unset: Safari can disable files with unrecognized extensions. -->
        <input id="file" type="file" hidden>
        <button id="reset" type="button" title="視点リセット（モデル全体を表示）" aria-label="視点リセット（モデル全体を表示）" disabled>↺</button>
        <div class="file-details">
          <span id="filename" hidden></span>
          <p id="status" role="status">ビューアーを起動中…</p>
          <p id="splat-count" class="hint" title="表示用に選択された数です。画面外や透明なスプラットも含みます。" hidden></p>
        </div>
      </div>
      <div class="actions">
        <details id="lod-controls" class="lod-controls">
          <summary>間引き設定</summary>
          <div class="lod-panel">
            <label class="checkbox"><input id="lod-enabled" type="checkbox" checked disabled>間引き表示（LoD）</label>
            <label>描画数の基準
              <select id="lod-count" disabled>
                <option value="">自動（端末に合わせる）</option>
                <option value="10000">1万</option>
                <option value="50000">5万</option>
                <option value="100000">10万</option>
                <option value="250000">25万</option>
                <option value="500000">50万</option>
                <option value="1000000">100万</option>
                <option value="2500000">250万</option>
                <option value="5000000">500万</option>
              </select>
            </label>
            <label class="lod-scale-label" for="lod-scale">描画数の倍率 <output id="lod-scale-value" for="lod-scale">1.00×</output></label>
            <input id="lod-scale" type="range" min="0.05" max="2" step="0.05" value="1" aria-label="描画数の倍率" disabled>
            <p class="hint">描画数の目標は「基準 × 倍率」です。小さくすると軽量になります。点群表示には適用しません。</p>
            <p class="hint">LoD データの作成で読み込み時間とメモリ使用量が増えます。</p>
          </div>
        </details>
        <label class="stereo-mode">表示
          <select id="stereo-mode" disabled>
            <option value="mono">単眼</option>
            <option value="parallel">平行法</option>
            <option value="cross">交差法</option>
          </select>
        </label>
        <label id="stereo-strength-control" hidden>立体感 <output id="stereo-strength-value">1.0</output>
          <input id="stereo-strength" type="range" min="0" max="3" step="0.1" value="1" aria-label="立体感の強さ">
        </label>
        <button id="points" type="button" aria-pressed="false" disabled>点群表示</button>
        <button id="ar" type="button" disabled title="WebXR対応状況を確認中">AR</button>
        <button id="vr" type="button" disabled title="WebXR対応状況を確認中">VR</button>
      </div>
    </header>
    <section id="empty">
      <h2>Splat ファイルを開く</h2>
      <p>ファイルをここにドロップするか、左上から選択</p>
      <p>PLY / SPLAT / KSPLAT / SPZ / SOG / ZIP / RAD</p>
      <p><a href="./viewer.html?url=samples/mfd1.sog">サンプルを開く</a></p>
    </section>
    <div id="stereo-guide" aria-hidden="true" hidden><span>●</span><span>●</span></div>
    <div id="drop-overlay" hidden>ドロップして開く</div>
    <button id="exit-xr" type="button" hidden>XRを終了</button>
    <footer>
      <p><span id="stereo-help" hidden></span>ドラッグで回転 · スクロールでズーム · 右ドラッグで移動</p>
    </footer>
  </main>
  <script type="module" src="./display-mode.js"></script>
  <script type="module" src="./file-viewer.js"></script>
</body>
</html>
