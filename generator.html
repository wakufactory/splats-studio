<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF Splat Studio</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <header class="toolbar">
    <div>
      <p class="eyebrow">SURFACE GENERATOR / SPARK.JS</p>
      <h1>SDF Splat Studio</h1>
    </div>
    <button id="download" type="button" disabled>PLY を保存</button>
  </header>
  <main>
    <form id="generator" aria-label="生成設定">
      <div class="form-heading">
        <h2>SDF を編集</h2>
        <select id="preset" aria-label="SDF プリセット">
          <option value="" hidden>カスタム</option>
        </select>
      </div>
      <p class="hint">負が内部、0 が表面、正が外部。Y 軸が上です。</p>
      <textarea id="source" aria-label="SDF の JavaScript コード" spellcheck="false" autocapitalize="off" autocomplete="off" required></textarea>
      <fieldset>
        <legend>サンプリング</legend>
        <label>探索範囲 ±<input id="extent" type="number" min="0.1" max="20" step="any" value="1.5" required></label>
        <label>各軸の分割数<input id="resolution" type="number" min="16" max="144" value="64" required></label>
      </fieldset>
      <fieldset>
        <legend>スプラット</legend>
        <label>面内の広がり<input id="size" type="number" min="0.3" max="1.5" step="any" value="0.72" required></label>
        <label>厚みの比率<input id="thickness" type="number" min="0.05" max="0.8" step="any" value="0.15" required></label>
        <label>ベース色<input id="color" type="color" value="#71debb"></label>
      </fieldset>
      <fieldset id="effect-settings">
        <legend>表面エフェクト</legend>
        <label class="wide">種類<select id="effect">
          <option value="none">なし</option><option value="fur">毛・起毛</option><option value="fluffy">モコモコ</option>
        </select></label>
        <div id="effect-controls" class="wide" hidden>
          <label>密度（本 / 面積 1）<input id="density" type="number" min="0" max="4000" step="10" value="700" required></label>
          <label>乱数シード<input id="seed" type="number" min="0" max="1000000" step="1" value="1" required></label>
          <label>長さ <output for="hairLength"></output><input id="hairLength" aria-label="長さ" type="range" min="0.01" max="0.6" step="0.005" value="0.16"></label>
          <label>太さ <output for="hairWidth"></output><input id="hairWidth" aria-label="太さ" type="range" min="0.001" max="0.15" step="0.001" value="0.012"></label>
          <label>方向の乱れ <output for="disorder"></output><input id="disorder" aria-label="方向の乱れ" type="range" min="0" max="1" step="0.01" value="0.35"></label>
          <label>長さ・太さのばらつき <output for="variation"></output><input id="variation" aria-label="長さ・太さのばらつき" type="range" min="0" max="1" step="0.01" value="0.4"></label>
          <label>毛束感 <output for="clump"></output><input id="clump" aria-label="毛束感" type="range" min="0" max="1" step="0.01" value="0.3"></label>
          <label>毛束の大きさ <output for="clumpSize"></output><input id="clumpSize" aria-label="毛束の大きさ" type="range" min="0.03" max="1" step="0.01" value="0.25"></label>
          <label class="wide checkbox"><input id="base" type="checkbox" checked>下地の表面を表示</label>
        </div>
        <p class="hint wide">設定後に「スプラットを生成」で反映。長さ・太さは SDF と同じ単位です。モコモコは太さを増やすと丸い房になります。</p>
      </fieldset>
      <div class="form-actions">
        <button class="primary" id="generate" type="submit" disabled>スプラットを生成</button>
        <button id="cancel" type="button" hidden>中止</button>
      </div>
      <p id="status" role="status">起動中…</p>
    </form>
    <section class="preview" aria-label="Spark プレビュー">
      <div id="viewport"></div>
      <div class="preview-tools">
        <span class="eyebrow">SPARK PREVIEW</span>
        <div>
          <button id="points" type="button" aria-pressed="false" disabled>中心点</button>
          <button id="reset" type="button" disabled>視点リセット</button>
        </div>
      </div>
      <p class="preview-help">ドラッグで回転 · スクロールでズーム · 右ドラッグで移動</p>
    </section>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
