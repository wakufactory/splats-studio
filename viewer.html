<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaussian Splat Viewer</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body class="file-viewer">
  <main id="file-viewer" aria-label="Gaussian Splat Viewer">
    <div id="viewport"></div>
    <header class="toolbar">
      <div>
        <p class="eyebrow">SPARK.JS / FILE VIEWER</p>
        <h1>Gaussian Splat Viewer</h1>
      </div>
      <div class="actions">
        <button id="points" type="button" aria-pressed="false" disabled>点群表示</button>
        <button id="reset" type="button" disabled>視点リセット</button>
        <button id="open" class="primary" type="button" disabled>ファイルを開く</button>
        <input id="file" type="file" accept=".ply,.splat,.ksplat,.spz,.sog,.zip,.rad" hidden>
      </div>
    </header>
    <section id="empty">
      <h2>Splat ファイルを開く</h2>
      <p>ファイルをここにドロップするか、右上から選択</p>
      <p>PLY / SPLAT / KSPLAT / SPZ / SOG / ZIP / RAD</p>
    </section>
    <div id="drop-overlay" hidden>ドロップして開く</div>
    <footer>
      <p id="status" role="status">ビューアーを起動中…</p>
      <p>ドラッグで回転 · スクロールでズーム · 右ドラッグで移動</p>
    </footer>
  </main>
  <script type="module" src="./file-viewer.js"></script>
</body>
</html>
